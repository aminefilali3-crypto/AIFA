import { useState, FormEvent } from 'react';
import { motion } from 'framer-motion';
import { FileText, Download, Wand2, Clock, CheckCircle2 } from 'lucide-react';
import PageLayout from '@/components/PageLayout';

const reportTypes = [
  { id: 'legal-analysis', label: 'Legal Analysis', desc: 'In-depth analysis of specific legal provisions or cases.' },
  { id: 'compliance-audit', label: 'Compliance Audit', desc: 'Regulatory compliance review for your organization.' },
  { id: 'financial-review', label: 'Financial Review', desc: 'Structured financial summary and risk assessment.' },
  { id: 'administrative-study', label: 'Administrative Study', desc: 'Bureaucratic process analysis and recommendations.' },
];

const recentReports = [
  { id: 1, title: 'Q3 2024 Regulatory Compliance Review', type: 'Compliance Audit', status: 'Ready', date: '28 Oct 2024', pages: 34 },
  { id: 2, title: 'Analysis of Law 31-08 Consumer Protection', type: 'Legal Analysis', status: 'Ready', date: '15 Oct 2024', pages: 22 },
  { id: 3, title: 'Annual Financial Risk Assessment — SME Sector', type: 'Financial Review', status: 'Processing', date: '01 Nov 2024', pages: null },
  { id: 4, title: 'Administrative Digitization Study 2024', type: 'Administrative Study', status: 'Ready', date: '05 Sep 2024', pages: 47 },
  { id: 5, title: 'Penal Code Reform Impact Analysis', type: 'Legal Analysis', status: 'Ready', date: '20 Aug 2024', pages: 19 },
];

function generateReportContent(type: string, topic: string): string {
  const typeMeta = reportTypes.find(r => r.id === type);
  const typeLabel = typeMeta?.label ?? 'Report';
  const date = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'long', year: 'numeric' });

  return `================================================================================
LAIFA  Legal & Administrative Intelligent Financial Assistant
${typeLabel.toUpperCase()} REPORT
================================================================================

Generated by: AIFA  AI Legal & Financial Assistant
Date:         ${date}
Platform:     LAIFA Intelligence Platform (laifa.ma)
Classification: CONFIDENTIAL  FOR PROFESSIONAL USE ONLY

--------------------------------------------------------------------------------
SUBJECT
--------------------------------------------------------------------------------

${topic}

--------------------------------------------------------------------------------
EXECUTIVE SUMMARY
--------------------------------------------------------------------------------

This report has been prepared by AIFA in response to the submitted request. The
analysis draws upon LAIFA's comprehensive repository of Moroccan legal texts,
judicial precedents, and administrative frameworks.

The scope of this ${typeLabel.toLowerCase()} encompasses the legal and regulatory
landscape relevant to the subject matter, with specific reference to applicable
statutes, regulatory instruments, and recent jurisprudential developments.

--------------------------------------------------------------------------------
I. LEGAL AND REGULATORY FRAMEWORK
--------------------------------------------------------------------------------

1.1  Primary Legislation

The subject matter falls under the purview of relevant Moroccan legislation,
including dahirs, laws, and decrees enacted by the Kingdom's legislative and
executive branches. The applicable regulatory framework has been reviewed and
cross-referenced against current legal databases indexed by LAIFA.

1.2  Regulatory Authorities

Implementation oversight is distributed across the competent public authorities,
including sector-specific regulators and ministerial departments, whose most
recent directives and circulars have been incorporated into this analysis.

1.3  International Instruments

Where applicable, Morocco's bilateral and multilateral treaty obligations have
been considered, including instruments ratified under the oversight of the
Ministry of Foreign Affairs and relevant international bodies.

--------------------------------------------------------------------------------
II. ANALYSIS
--------------------------------------------------------------------------------

2.1  Current State Assessment

Based on the information provided and available legal sources, AIFA has conducted
a systematic review of the regulatory environment governing the stated subject.
The following observations are relevant to the professional assessment:

  (a) The current legal framework provides a structured basis for addressing
      the operational and compliance requirements associated with the subject.

  (b) Recent legislative developments — including amendments enacted during the
      2024–2026 parliamentary sessions — have introduced material changes that
      must be integrated into any comprehensive analysis.

  (c) Judicial interpretation by administrative and commercial courts has
      clarified certain provisions previously subject to interpretive ambiguity.

2.2  Risk Factors

The following risk factors have been identified through AIFA's automated analysis:

  - Regulatory risk: Moderate exposure to evolving compliance requirements.
  - Legal uncertainty: Certain provisions remain subject to interpretive divergence.
  - Implementation risk: Operational alignment with new requirements may require
    institutional adjustments.

2.3  Opportunities

  - Streamlined procedures introduced under recent reform packages present
    efficiency gains for qualified practitioners and institutions.
  - Harmonization with international standards creates new avenues for cross-
    border operational activities.

--------------------------------------------------------------------------------
III. RECOMMENDATIONS
--------------------------------------------------------------------------------

3.1  Immediate Actions

Based on the analysis conducted, the following actions are recommended in the
near term:

  1. Conduct a detailed review of all applicable regulatory instruments in
     conjunction with qualified legal counsel.
  2. Implement internal compliance monitoring procedures aligned with current
     regulatory expectations.
  3. Engage with relevant regulatory authorities to clarify any outstanding
     interpretive uncertainties.

3.2  Medium-Term Strategy

  1. Develop a structured compliance calendar aligned with the regulatory
     reporting cycle.
  2. Invest in capacity development to maintain alignment with evolving standards.
  3. Periodically review and update internal policies in light of jurisprudential
     developments indexed by LAIFA.

--------------------------------------------------------------------------------
IV. REFERENCES
--------------------------------------------------------------------------------

  [1] Dahir No. 1-03-194 promulgating Law 65-99 (Labor Code), as amended.
  [2] Code of Obligations and Contracts (COC), Dahir of 9 Ramadan 1331.
  [3] Law 15-95 forming the Commercial Code of Morocco.
  [4] Law 41-90 establishing Administrative Courts.
  [5] General Tax Code (CGI), Finance Act 2024 version.
  [6] Relevant circulars and directives of competent regulatory authorities.

--------------------------------------------------------------------------------
DISCLAIMER
--------------------------------------------------------------------------------

This report has been generated by AIFA, an AI-powered assistant integrated within
the LAIFA Intelligence Platform. It is provided for informational purposes to
qualified legal, financial, and administrative professionals and does not constitute
legal advice. Users should verify all references independently and consult licensed
practitioners before taking any action based on this analysis.

================================================================================
END OF REPORT — LAIFA INTELLIGENCE PLATFORM
© ${new Date().getFullYear()} LAIFA Systems. All rights reserved.
================================================================================
`;
}

function downloadReport(type: string, topic: string) {
  const content = generateReportContent(type, topic);
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const typeMeta = reportTypes.find(r => r.id === type);
  const filename = `LAIFA_${typeMeta?.label.replace(/\s+/g, '_')}_Report_${new Date().toISOString().slice(0, 10)}.txt`;
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadExistingReport(title: string) {
  const content = `================================================================================
LAIFA — Legal & Administrative Intelligent Financial Assistant
REPORT DOCUMENT
================================================================================

Title: ${title}
Generated: LAIFA Intelligence Platform
Classification: CONFIDENTIAL  FOR PROFESSIONAL USE ONLY

This document has been retrieved from the LAIFA archive.
Full content is available within the LAIFA platform for authorized users.

================================================================================
© ${new Date().getFullYear()} LAIFA Systems. All rights reserved.
================================================================================
`;
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `LAIFA_${title.replace(/[^a-z0-9]/gi, '_').slice(0, 40)}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

export default function Reports() {
  const [selectedType, setSelectedType] = useState('');
  const [topic, setTopic] = useState('');
  const [generating, setGenerating] = useState(false);
  const [generated, setGenerated] = useState(false);

  const handleGenerate = (e: FormEvent) => {
    e.preventDefault();
    if (!selectedType || !topic) return;
    setGenerating(true);
    setGenerated(false);
    setTimeout(() => { setGenerating(false); setGenerated(true); }, 2500);
  };

  const handleReset = () => {
    setGenerated(false);
    setSelectedType('');
    setTopic('');
  };

  return (
    <PageLayout>
      <section className="relative py-20 border-b border-border overflow-hidden">
        <div className="absolute top-0 left-1/3 w-[500px] h-[300px] bg-primary/8 rounded-full filter blur-[120px] pointer-events-none" />
        <div className="max-w-7xl mx-auto px-6 relative z-10">
          <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }}>
            <p className="text-xs font-mono text-primary tracking-widest uppercase mb-3">Module — 03</p>
            <h1 className="text-4xl md:text-6xl font-bold text-foreground mb-4">Intelligent Reports</h1>
            <p className="text-lg text-muted-foreground max-w-2xl">
              Generate comprehensive, formatted reports using AI. Transform research into presentation-ready documents in seconds.
            </p>
          </motion.div>
        </div>
      </section>

      <section className="py-12">
        <div className="max-w-7xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-5 gap-12">
          {/* Generator Form */}
          <motion.div
            initial={{ opacity: 0, x: -20 }}
            animate={{ opacity: 1, x: 0 }}
            className="lg:col-span-2"
          >
            <h2 className="text-sm font-mono text-primary uppercase tracking-widest mb-6">Generate New Report</h2>
            <form onSubmit={handleGenerate} className="bg-card border border-border rounded-sm p-6 space-y-5">
              <div className="space-y-3">
                <label className="text-xs font-mono text-muted-foreground uppercase tracking-wider">Report Type</label>
                <div className="grid grid-cols-1 gap-2">
                  {reportTypes.map(rt => (
                    <button
                      key={rt.id}
                      type="button"
                      onClick={() => { setSelectedType(rt.id); setGenerated(false); }}
                      disabled={generating}
                      className={`text-left p-3 rounded-sm border transition-all disabled:opacity-50 ${selectedType === rt.id ? 'border-primary bg-primary/10 text-foreground' : 'border-border bg-background text-muted-foreground hover:border-primary/40'}`}
                    >
                      <div className="font-semibold text-sm">{rt.label}</div>
                      <div className="text-xs mt-0.5 opacity-70">{rt.desc}</div>
                    </button>
                  ))}
                </div>
              </div>

              <div className="space-y-2">
                <label className="text-xs font-mono text-muted-foreground uppercase tracking-wider">Subject / Topic</label>
                <textarea
                  value={topic}
                  onChange={e => { setTopic(e.target.value); setGenerated(false); }}
                  rows={3}
                  disabled={generating}
                  placeholder="Describe the specific topic or scope for this report..."
                  className="w-full bg-background border border-border rounded-sm px-4 py-3 text-foreground focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-muted-foreground/50 text-sm resize-none disabled:opacity-50"
                />
              </div>

              <button
                type="submit"
                disabled={generating || !selectedType || !topic.trim()}
                className="w-full bg-primary text-primary-foreground py-3 rounded-sm font-bold flex items-center justify-center gap-2 hover:bg-primary/90 shadow-[0_0_15px_rgba(0,200,255,0.3)] transition-all disabled:opacity-40 disabled:cursor-not-allowed"
              >
                {generating ? (
                  <><Clock className="w-4 h-4 animate-spin" /> Generating...</>
                ) : generated ? (
                  <><CheckCircle2 className="w-4 h-4" /> Report Ready</>
                ) : (
                  <><Wand2 className="w-4 h-4" /> Generate with AI</>
                )}
              </button>

              {generated && (
                <motion.div initial={{ opacity: 0, y: 8 }} animate={{ opacity: 1, y: 0 }} className="p-4 bg-green-500/10 border border-green-500/30 rounded-sm space-y-3">
                  <p className="text-sm text-green-400 font-mono">Report generated successfully. Ready to download.</p>
                  <div className="flex gap-3">
                    <button
                      type="button"
                      onClick={() => downloadReport(selectedType, topic)}
                      className="flex items-center gap-2 text-sm font-bold text-primary hover:text-primary/80 transition-colors"
                    >
                      <Download className="w-4 h-4" /> Download Report
                    </button>
                    <span className="text-border">|</span>
                    <button
                      type="button"
                      onClick={handleReset}
                      className="text-sm text-muted-foreground hover:text-foreground transition-colors font-mono"
                    >
                      New Report
                    </button>
                  </div>
                </motion.div>
              )}
            </form>
          </motion.div>

          {/* Recent Reports */}
          <motion.div
            initial={{ opacity: 0, x: 20 }}
            animate={{ opacity: 1, x: 0 }}
            transition={{ delay: 0.1 }}
            className="lg:col-span-3"
          >
            <h2 className="text-sm font-mono text-primary uppercase tracking-widest mb-6">Recent Reports</h2>
            <div className="space-y-3">
              {recentReports.map((r, i) => (
                <motion.div
                  key={r.id}
                  initial={{ opacity: 0, y: 12 }}
                  animate={{ opacity: 1, y: 0 }}
                  transition={{ delay: 0.15 + i * 0.07 }}
                  className="group bg-card border border-border p-5 rounded-sm hover:border-primary/50 transition-all flex items-start justify-between gap-4"
                >
                  <div className="flex items-start gap-4">
                    <div className="w-10 h-10 bg-background border border-border rounded-sm flex items-center justify-center text-primary shrink-0 group-hover:border-primary/50 transition-colors">
                      <FileText className="w-5 h-5" />
                    </div>
                    <div>
                      <h3 className="font-semibold text-foreground text-sm group-hover:text-primary transition-colors">{r.title}</h3>
                      <div className="flex items-center gap-3 mt-1.5 flex-wrap">
                        <span className="text-xs font-mono text-muted-foreground">{r.type}</span>
                        <span className="text-xs text-muted-foreground">{r.date}</span>
                        {r.pages && <span className="text-xs text-muted-foreground">{r.pages} pages</span>}
                      </div>
                    </div>
                  </div>
                  <div className="flex items-center gap-3 shrink-0">
                    <span className={`text-xs font-mono border px-2 py-1 rounded-sm ${r.status === 'Ready' ? 'text-green-400 border-green-400/30 bg-green-400/5' : 'text-yellow-400 border-yellow-400/30 bg-yellow-400/5'}`}>
                      {r.status}
                    </span>
                    {r.status === 'Ready' && (
                      <button
                        onClick={() => downloadExistingReport(r.title)}
                        title="Download report"
                        className="text-muted-foreground hover:text-primary transition-colors"
                      >
                        <Download className="w-4 h-4" />
                      </button>
                    )}
                  </div>
                </motion.div>
              ))}
            </div>
          </motion.div>
        </div>
      </section>
    </PageLayout>
  );
}

